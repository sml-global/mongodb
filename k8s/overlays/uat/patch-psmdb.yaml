apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: psmdb
  namespace: mongodb
spec:
  replsets:
    - name: rs0
      serviceAccountName: psmdb-db
      size: 3
      affinity:
        antiAffinityTopologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 2Gi
      volumeSpec:
        persistentVolumeClaim:
          storageClassName: gp3-mongodb
          resources:
            requests:
              storage: 100Gi
  backup:
    enabled: true
    # Resource requests/limits for the operator-managed backup-agent
    # container are inherited from the base (k8s/base/psmdb-cluster.yaml
    # spec.backup.resources) and do not need to be repeated here. The base
    # already sets cpu: 500m-2, memory: 1Gi-1Gi. See #60.
    storages:
      s3-main:
        type: s3
        s3:
          # PBM backup bucket created by platform-prerequisites/terraform/
          # mongodb/terraform.uat.tfvars (pbm_bucket_name) -- see #51.
          bucket: sml-oms-uat-mongodb-pbm-672172129937
          region: ap-east-1
