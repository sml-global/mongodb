# k8s/dr-drill/rbac.yaml
#
# RBAC for the 3 dr-drill-*-runner ServiceAccounts (created in the
# dr-drill-uat namespace by scripts/bootstrap-dr-drill-role-arns-configmap.sh).
# These ServiceAccounts already carry AWS identity via EKS Pod Identity
# (platform-prerequisites/terraform/dr-drill/main.tf) -- this file grants the
# separate, additional Kubernetes API permissions each drill script needs
# (kubectl create/delete namespace, deploy+wait+exec into the throwaway
# restore-target pod, apply the CNPG Cluster manifest).
#
# DEVIATION FROM NAMESPACE-SCOPED Role/RoleBinding: each drill script
# generates its own throwaway namespace name at runtime (e.g.
# dr-drill-mongodb-$(date +%s) -- see scripts/dr-drill-mongodb-restore.sh),
# so the target namespace does not exist yet at the time this RBAC is
# applied. A namespace-scoped Role/RoleBinding cannot be bound ahead of time
# to a namespace that doesn't exist. Functionally equivalent, least-privilege
# ClusterRoles (scoped by resource type/verb, not by namespace) are used
# instead, via ClusterRoleBindings. See design spec addendum documenting this
# RBAC (docs/superpowers/specs/2026-07-28-phase4-day2-operations-design.md).
#
# The 3 ServiceAccounts themselves are NOT defined here -- they are owned by
# scripts/bootstrap-dr-drill-role-arns-configmap.sh (created idempotently
# from Terraform's role ARN outputs). This file only grants them permissions
# via subjects referencing those existing names.
---
# Cluster-scoped: drill scripts create and tear down their own throwaway
# namespace on every run (`kubectl create namespace`, cleanup trap
# `kubectl delete namespace ... --wait=false`).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dr-drill-namespace-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dr-drill-namespace-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dr-drill-namespace-manager
subjects:
  - kind: ServiceAccount
    name: dr-drill-mongodb-runner
    namespace: dr-drill-uat
  - kind: ServiceAccount
    name: dr-drill-postgresql-runner
    namespace: dr-drill-uat
  - kind: ServiceAccount
    name: dr-drill-clickhouse-runner
    namespace: dr-drill-uat
---
# Cluster-scoped (see DEVIATION note above): pod get/list/watch (needed by
# `kubectl wait --for=condition=ready pod ...`), pods/exec (needed by
# `kubectl exec ... -c <container> -- ...`), Deployment apply (throwaway
# mongodb-restore-target.yaml / clickhouse-restore-target.yaml), and CNPG
# Cluster apply (dr-drill-postgresql-restore.sh's inline manifest).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dr-drill-workload-operator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dr-drill-workload-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dr-drill-workload-operator
subjects:
  - kind: ServiceAccount
    name: dr-drill-mongodb-runner
    namespace: dr-drill-uat
  - kind: ServiceAccount
    name: dr-drill-postgresql-runner
    namespace: dr-drill-uat
  - kind: ServiceAccount
    name: dr-drill-clickhouse-runner
    namespace: dr-drill-uat
