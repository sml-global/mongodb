apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# dev keeps the operator in the same namespace/watch-scope it has always
# used (mongodb) -- this overlay exists for structural parity with uat and
# to make the environment-aware selection in
# scripts/provision-k8s-components.sh explicit, not because dev's behavior
# changes.
patches:
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: mongodb
    target:
      kind: HelmRelease
      name: percona-server-mongodb-operator
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: mongodb
    target:
      kind: HelmRepository
      name: percona
  - patch: |-
      - op: replace
        path: /spec/chart/spec/sourceRef/namespace
        value: mongodb
    target:
      kind: HelmRelease
      name: percona-server-mongodb-operator
  - patch: |-
      - op: replace
        path: /spec/values/watchNamespace
        value: mongodb
    target:
      kind: HelmRelease
      name: percona-server-mongodb-operator
