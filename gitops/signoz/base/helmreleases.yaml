apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: signoz
  namespace: signoz
spec:
  interval: 30m
  chart:
    spec:
      chart: signoz
      version: 0.130.1
      sourceRef:
        kind: HelmRepository
        name: signoz
        namespace: signoz
  # valuesFrom injects values from Secrets/ConfigMaps at the HelmRelease level
  # (a Flux feature). The SigNoz chart doesn't support valueFrom.secretKeyRef
  # natively at the values level (it expects a plain password string), so we
  # use Flux's valuesFrom to template it in. See #54.
  valuesFrom:
    - kind: Secret
      name: signoz-clickhouse
      valuesKey: password
      targetPath: clickhouse.password
  values:
    global:
      storageClass: gp3-mongodb
    clickhouse:
      # Dedicated ServiceAccount name so the live ClickHouse pod can be
      # bound to its own least-privilege IAM identity via EKS Pod Identity
      # (write-only s3:PutObject/ListBucket scoped to
      # oms-signoz-clickhouse-backups -- see
      # platform-prerequisites/terraform/dr-drill/main.tf
      # signoz_clickhouse_backup_writer_role). `create: true` is the
      # subchart default, so the chart creates this ServiceAccount itself;
      # verified against the real upstream values.yaml (`serviceAccount:
      # {create, name, annotations}`, resolved via the
      # `clickhouse.serviceAccountName` named template), not fabricated.
      # See docs/superpowers/specs/2026-07-28-phase4-day2-operations-design.md (D15).
      serviceAccount:
        name: signoz-clickhouse-workload
      # clickhouse-backup sidecar: enables application-consistent backups
      # (FREEZE TABLE-based) instead of raw EBS snapshots. Wired via the real
      # `extraContainers` hook exposed by the upstream clickhouse subchart
      # (charts.signoz.io/clickhouse) -- verified against its values.yaml,
      # not a fabricated key. See scripts/dr-drill-clickhouse-backup-restore.sh
      # and Phase 4 design spec
      # docs/superpowers/specs/2026-07-28-phase4-day2-operations-design.md (D1).
      # Runs in server mode (REST API on port 7171) so kubectl exec commands
      # (clickhouse-backup create/upload/download/restore) work correctly.
      # See #54.
      extraContainers:
        - name: clickhouse-backup
          image: altinity/clickhouse-backup:2.5.19
          command: ["clickhouse-backup", "server"]
          env:
            - name: REMOTE_STORAGE
              value: s3
            - name: REMOTE_STORAGE_S3_BUCKET
              value: oms-signoz-clickhouse-backups
            - name: REMOTE_STORAGE_S3_PATH
              value: clickhouse-backups
            - name: CLICKHOUSE_HOST
              value: localhost
            - name: CLICKHOUSE_PORT
              value: "9000"
          ports:
            - name: backup-rest
              containerPort: 7171
    signoz:
      # Bootstraps the SigNoz admin (root) user at pod startup so no manual
      # "Sign Up" step is needed in the UI. Requires SigNoz v0.112.0+.
      # Secret is created by scripts/create-signoz-root-user-secret.sh.
      # Ref: https://signoz.io/docs/manage/administrator-guide/configuration/root-user/
      env:
        SIGNOZ_USER_ROOT_ENABLED: "true"
        SIGNOZ_USER_ROOT_ORG_NAME: "oms"
        SIGNOZ_USER_ROOT_EMAIL:
          valueFrom:
            secretKeyRef:
              name: signoz-root-user
              key: email
        SIGNOZ_USER_ROOT_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: signoz-root-user
              key: password
  install:
    createNamespace: true
