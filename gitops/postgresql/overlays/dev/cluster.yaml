apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: oms-postgresql
  namespace: postgresql
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    storageClass: gp3-postgresql
    size: 50Gi
  backup:
    barmanObjectStore:
      destinationPath: s3://oms-postgresql-backup
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
  # IRSA authentication — no credentials secret; pod identity via
  # service account oms-postgresql-workload annotated with IAM role.
  # serviceAccountName references an EXISTING ServiceAccount (created and
  # IRSA-annotated by Phase 2 Terraform) rather than having the operator
  # generate one; this field is mutually exclusive with serviceAccountTemplate
  # per the CNPG Cluster CRD reference (cloudnative-pg.io/docs/devel/
  # cloudnative-pg.v1#clusterspec) — do not add serviceAccountTemplate here.
  serviceAccountName: oms-postgresql-workload
