apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: postgresql-operator
spec:
  interval: 10m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.22.x"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  values:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
