---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cluster-autoscaler
  namespace: kube-system
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: cluster-autoscaler
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    autoDiscovery:
      clusterName: REPLACE_CLUSTER_NAME
    serviceAccount:
      create: false
      name: REPLACE_AUTOSCALER_SERVICE_ACCOUNT
      annotations:
        eks.amazonaws.com/role-arn: REPLACE_CLUSTER_AUTOSCALER_ROLE_ARN
---
