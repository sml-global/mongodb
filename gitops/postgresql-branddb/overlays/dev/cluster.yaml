apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: oms-postgresql-branddb
  namespace: branddb
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  storage:
    storageClass: gp3-postgresql
    size: 50Gi
  backup:
    barmanObjectStore:
      destinationPath: s3://oms-postgresql-branddb-backup
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
  # IRSA authentication — no credentials secret; pod identity via
  # service account oms-postgresql-brand-workload annotated with IAM role,
  # created by platform-prerequisites/terraform/postgresql-branddb.
  # serviceAccountName references an EXISTING ServiceAccount rather than
  # having the operator generate one; this field is mutually exclusive
  # with serviceAccountTemplate per the CNPG Cluster CRD reference
  # (cloudnative-pg.io/docs/devel/cloudnative-pg.v1#clusterspec) — do not
  # add serviceAccountTemplate here.
  serviceAccountName: oms-postgresql-brand-workload
